# Accounts and groups for the Switchboard broker and runner. Install as /etc/sysusers.d/switchboard.conf,
# then run systemd-sysusers. Add the assistant's account to switchboard-client and your own account to
# switchboard-operator yourself (usermod -aG); never add one account to both. See docs/ISOLATION.md.
#Type Name                 ID GECOS
u     switchboard          -  "Switchboard broker and runner"
g     switchboard-client   -
g     switchboard-operator -
m     switchboard          switchboard-client
m     switchboard          switchboard-operator
