[project]
name = "switchboard"
version = "0.1.0"
description = "Self-hosted hooks and a policy gate that let AI assistants use your mail, calendar, money, and shopping data without paid aggregators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
switchboard = "switchboard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: starts local servers or subprocesses; never touches real accounts",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S603",  # subprocess without shell is intentional for cmd: secret references
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S310"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["switchboard"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
